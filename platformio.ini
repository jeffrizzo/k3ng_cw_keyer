; PlatformIO project configuration for the K3NG CW keyer.
;
; The sketch stays in k3ng_keyer/ and the bundled libraries stay in libraries/
; so the Arduino IDE build keeps working unchanged.
;
; Hardware profile and feature selection are still done by editing
; k3ng_keyer/keyer_hardware.h and the keyer_features_and_options*.h files.
;
;   pio run                      build the default environment
;   pio run -e nano -t upload    build and upload
;   pio device monitor           serial monitor

[platformio]
src_dir = k3ng_keyer
lib_dir = libraries
default_envs = nano

[env]
framework = arduino
monitor_speed = 115200
; chain+ evaluates #if/#ifdef so only libraries for enabled features are built
lib_ldf_mode = chain+
; lets PlatformIO generate prototypes for indented function definitions in the .ino
extra_scripts = pre:platformio_ino_prototypes.py

; Arduino Nano (ATmega328P)
[env:nano]
platform = atmelavr
board = nanoatmega328new

; Arduino Nano (ATmega328P) with the old bootloader
[env:nano_oldbootloader]
platform = atmelavr
board = nanoatmega328
